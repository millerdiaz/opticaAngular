<div class="formregistro">
  <div class="d-flex justify-content-center my-5 align-items-center my-5">
    <div class="form-container">
      <p class="title">Registrate</p>
      <form [formGroup]="formulario" class="form" (ngSubmit)="registro()">
        <div class="input-group mb-2">
          <label for="nombre">Nombre</label>
          <input formControlName="nombre" type="text" name="name" id="name" placeholder="">
        </div>
        <div class="input-group mb-2">
          <label for="apellido">Apellido</label>
          <input formControlName="apellido" type="text" name="apellido" id="apellido" placeholder="">
        </div>
        <div class="input-group mb-2">
          <label for="correo">Correo electrónico</label>
          <input formControlName="correo" type="email" name="email" id="email" placeholder="">
        </div>
        <div class="input-group mb-2">
          <label for="contrasena">Contraseña</label>
          <input formControlName="contrasena" type="password" name="password" id="password" placeholder="">
        </div>
        <button type="submit" class="sign">Registrate</button>
      </form>
      <p class="inicioSesion">¿Ya estás registrado?
        <a [routerLink]="['/login']">Iniciar sesión</a></p>
    </div>
  </div>
</div>
